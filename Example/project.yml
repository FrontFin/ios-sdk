name: MeshLinkExample
options:
  bundleIdPrefix: com.meshpay.ios
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  MeshLink:
    # The local SDK, one directory up.
    path: ..

targets:
  MeshLinkExample:
    type: application
    platform: iOS
    sources:
      - MeshLinkExample
    dependencies:
      - package: MeshLink
        product: MeshLink
    settings:
      base:
        DEVELOPMENT_TEAM: C6WMXUCWYF
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.meshpay.ios.example
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
