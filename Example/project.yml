name: MeshpayLinkExample
options:
  bundleIdPrefix: com.meshpay.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  MeshpayLink:
    # The local SDK, one directory up.
    path: ..

targets:
  MeshpayLinkExample:
    type: application
    platform: iOS
    sources:
      - MeshpayLinkExample
    dependencies:
      - package: MeshpayLink
        product: MeshpayLink
    settings:
      base:
        DEVELOPMENT_TEAM: C6WMXUCWYF
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.meshpay.example.MeshpayLinkExample
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
