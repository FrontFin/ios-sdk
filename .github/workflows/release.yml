# Runs on pushes to main and on manual triggers. Mirrors the other MeshPay mobile
# SDKs' release workflow: detect a version bump in VERSION against the latest tag,
# validate the changelog, run CI, then create the GitHub Release — which creates
# the plain `X.Y.Z` tag that Swift Package Manager resolves. There is no publish
# job: the GitHub Release IS the publication for SPM.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    outputs:
      new_version: ${{ steps.version_check.outputs.new_version }}
      version: ${{ steps.version_check.outputs.version }}
      previous_tag: ${{ steps.version_check.outputs.previous_tag }}
      bump_message: ${{ steps.version_check.outputs.bump_message }}

    steps:
      - name: Checkout 🎾
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check if new version & bump type 🔍📊
        id: version_check
        run: |
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+$'

          VERSION=$(tr -d '[:space:]' < VERSION)
          # iOS tags are plain X.Y.Z (no `v` prefix), so SPM resolves them.
          LATEST_TAG=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)

          if [[ ! "$VERSION" =~ $SEMVER_RE ]]; then
            echo "::error::VERSION must be MAJOR.MINOR.PATCH; got: ${VERSION:-<empty>}"
            exit 1
          fi

          semver_gt() {
            IFS='.' read -r A_MAJOR A_MINOR A_PATCH <<< "$1"
            IFS='.' read -r B_MAJOR B_MINOR B_PATCH <<< "$2"
            if [[ "$A_MAJOR" -gt "$B_MAJOR" ]]; then return 0; fi
            if [[ "$A_MAJOR" -eq "$B_MAJOR" && "$A_MINOR" -gt "$B_MINOR" ]]; then return 0; fi
            if [[ "$A_MAJOR" -eq "$B_MAJOR" && "$A_MINOR" -eq "$B_MINOR" && "$A_PATCH" -gt "$B_PATCH" ]]; then return 0; fi
            return 1
          }

          echo "Current VERSION: $VERSION"
          echo "Latest git tag: ${LATEST_TAG:-<none>}"

          if [[ "$VERSION" == "$LATEST_TAG" ]]; then
            echo "No new version detected — skipping release"
            echo "new_version=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "$LATEST_TAG" ]] && ! semver_gt "$VERSION" "$LATEST_TAG"; then
            echo "::error::VERSION ($VERSION) is not greater than the latest tag ($LATEST_TAG) — accidental downgrade?"
            exit 1
          elif [[ -n "$(git tag -l "$VERSION")" ]]; then
            echo "::error::Tag $VERSION already exists — accidental reuse?"
            exit 1
          else
            echo "New version detected: $VERSION (previous: ${LATEST_TAG:-<none>})"
            echo "new_version=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "previous_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

            if [[ -z "$LATEST_TAG" ]]; then
              MESSAGE=":package: Release (no previous tag)"
            else
              IFS='.' read -r L_MAJOR L_MINOR L_PATCH <<< "$VERSION"
              IFS='.' read -r P_MAJOR P_MINOR P_PATCH <<< "$LATEST_TAG"
              if [[ "$L_MAJOR" -gt "$P_MAJOR" ]]; then
                MESSAGE=":exclamation: Major (breaking change)"
              elif [[ "$L_MINOR" -gt "$P_MINOR" ]]; then
                MESSAGE=":yo-yo: Minor (new feature)"
              else
                MESSAGE=":broom: Patch (bugfix or improvement)"
              fi
            fi
            {
              echo "bump_message<<EOF"
              echo "$MESSAGE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Validate changelog 📋
        if: steps.version_check.outputs.new_version == 'true'
        env:
          VERSION: ${{ steps.version_check.outputs.version }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::Missing CHANGELOG.md file."
            exit 1
          fi
          if ! grep -Fxq "## ${VERSION}" CHANGELOG.md; then
            echo "::error::No changelog entry found for version ${VERSION} in CHANGELOG.md"
            exit 1
          fi
          echo "Changelog entry for ${VERSION} found ✓"

      - name: Assert VERSION matches Version.swift 🏷️
        if: steps.version_check.outputs.new_version == 'true'
        run: |
          VERSION_FILE=$(tr -d '[:space:]' < VERSION)
          VERSION_SWIFT=$(grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' Sources/MeshpayLink/Version.swift | head -n 1)
          if [ "$VERSION_FILE" != "$VERSION_SWIFT" ]; then
            echo "::error::VERSION ($VERSION_FILE) and Version.swift ($VERSION_SWIFT) disagree"
            exit 1
          fi

  ci:
    needs: check-version
    if: needs.check-version.outputs.new_version == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout 🎾
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build 🔨
        run: swift build

      - name: Unit tests ✅
        run: swift test

  release:
    needs: [check-version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      PREV_TAG: ${{ needs.check-version.outputs.previous_tag }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout 🎾
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Creates the plain X.Y.Z tag on the built commit (what SPM resolves).
      - name: Create GitHub Release 🚀
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${VERSION}"
          CHANGELOG_SECTION=$(awk -v version="$VERSION" '$0 == "## " version {found=1; next} found && /^## /{exit} found{print}' CHANGELOG.md)

          {
            echo "## What's Changed"
            echo
            echo "${CHANGELOG_SECTION}"
            if [[ -n "$PREV_TAG" ]]; then
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            fi
          } > "$RUNNER_TEMP/release_notes.md"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release_notes.md" \
            --target "$GITHUB_SHA"

          echo "release_url=https://github.com/${{ github.repository }}/releases/tag/${TAG}" >> "$GITHUB_OUTPUT"

      - name: Send release announcement to Slack 📣
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: ":ios: MeshPay iOS SDK Release: ${{ needs.check-version.outputs.version }}"
                  emoji: true
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ needs.check-version.outputs.bump_message }}"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "<!subteam^S091246FEDR> view release on <${{ steps.create_release.outputs.release_url }}|${{ github.repository }}>"
